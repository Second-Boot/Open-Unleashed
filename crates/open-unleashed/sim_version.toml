# The physics version (PORT-DEVIATION D56, RE/notes/lobby.md section 14.1). The port announces `sim=<version>` to the internet lobby
# server; players with different versions never share a game, and the server re-simulates a race with the --resim binary built for it.
#
# `version`     the number the lobby sees. An enhancement never changes it.
# `source_hash` the hash of the simulation set (sim_set.rs) this number was last confirmed for. The test
#               `brand::sim_version_tests::sim_version_file_matches_the_simulation_sources` fails when the sources differ from it.
#
# When the test fails after a change of the simulation set:
#   * physics behaviour may have changed:  NFS_UPDATE_SIM_VERSION=bump cargo test -p open-unleashed sim_version_file   (number + 1, new hash)
#   * provably non-behavioural (comments, refactor): NFS_UPDATE_SIM_VERSION=1 cargo test -p open-unleashed sim_version_file   (hash only);
#     allowed only when the three race goldens AND net_loop_det.sh come out identical. When in doubt, bump.
# Commit this file in the same commit as the change. Keep a --resim binary on the server for every released number.
version = 1
source_hash = "8d9124f0d91186aa"
